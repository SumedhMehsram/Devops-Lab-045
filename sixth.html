<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>

<style>
/* 🌌 FUTURISTIC ANIMATED BACKGROUND */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(270deg,
        #0f2027,
        #203a43,
        #2c5364,
        #7f00ff,
        #00f2fe
    );
    background-size: 1200% 1200%;
    animation: bgFlow 18s ease infinite;
}

/* 🔥 GLOWING FUTURISTIC HEADERS */
h1 {
    margin-top: 25px;
    font-size: 46px;
    letter-spacing: 4px;
    background: linear-gradient(270deg,#00f2fe,#4facfe,#f093fb,#00ffcc);
    background-size: 800% 800%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: neonText 5s ease infinite;
    text-shadow: 0 0 25px rgba(0,255,255,0.6);
}

h2 {
    font-size: 26px;
    margin-bottom: 25px;
    background: linear-gradient(270deg,#ff00cc,#3333ff,#00ff99);
    background-size: 600% 600%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: neonText 4s ease infinite reverse;
}

/* 🧊 FUTURISTIC GLASS FORM */
form {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    padding: 40px 50px;
    border-radius: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    animation: slideUp 1.2s ease;
}

/* TABLE */
table {
    border-collapse: separate;
    border-spacing: 16px;
}

td {
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
}

/* INPUTS */
input[type="text"],
textarea,
select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.85);
    transition: 0.4s;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #00f2fe;
    box-shadow: 0 0 15px #00f2fe;
}

/* RADIO & CHECKBOX */
input[type="radio"],
input[type="checkbox"] {
    accent-color: #ff00cc;
    transform: scale(1.2);
    margin-right: 6px;
}

/* 🚀 FUTURISTIC BUTTONS */
input[type="submit"],
input[type="reset"] {
    padding: 14px 36px;
    border: none;
    border-radius: 40px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.5s;
    position: relative;
    overflow: hidden;
}

/* REGISTER */
input[type="submit"] {
    background: linear-gradient(270deg,#00f2fe,#4facfe,#00ffcc);
    color: #000;
    box-shadow: 0 0 20px rgba(0,242,254,0.8);
}

/* CLEAR */
input[type="reset"] {
    background: linear-gradient(270deg,#ff512f,#dd2476,#ff00cc);
    color: #fff;
    margin-left: 12px;
    box-shadow: 0 0 20px rgba(255,0,204,0.7);
}

/* BUTTON HOVER */
input[type="submit"]:hover,
input[type="reset"]:hover {
    transform: translateY(-6px) scale(1.1);
    box-shadow: 0 0 35px rgba(255,255,255,0.9);
}

/* 🎞️ ANIMATIONS */
@keyframes bgFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes neonText {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<body>

<h1>DEVOPS LAB</h1>
<h2>STUDENT REGISTRATION FORM</h2>

<form>
<table>
<tr>
<td>Name</td>
<td><input type="text" placeholder="Enter your name"></td>
</tr>

<tr>
<td>Contact Number</td>
<td><input type="text" placeholder="Enter mobile number"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
</td>
</tr>

<tr>
<td>Address</td>
<td><textarea rows="3" placeholder="Enter address"></textarea></td>
</tr>

<tr>
<td>Hobbies</td>
<td>
<input type="checkbox"> Singing
<input type="checkbox"> Travelling
<input type="checkbox"> Reading
</td>
</tr>

<tr>
<td>Skillset</td>
<td>
<input type="checkbox"> C
<input type="checkbox"> Python
<input type="checkbox"> Java
</td>
</tr>

<tr>
<td>Highest Qualification</td>
<td>
<select>
<option>--SELECT--</option>
<option>Ph.D</option>
<option>M.E / M.Tech</option>
<option>B.E / B.Tech</option>
<option>Diploma</option>
<option>Intermediate</option>
<option>SSC</option>
</select>
</td>
</tr>

<tr>
<td>District (Telangana)</td>
<td>
<select>
<option>--SELECT--</option>
<option>Adilabad</option>
<option>Bhadradri Kothagudem</option>
<option>Hanumakonda</option>
<option>Hyderabad</option>
<option>Jagtial</option>
<option>Jangaon</option>
<option>Jayashankar Bhupalpally</option>
<option>Jogulamba Gadwal</option>
<option>Kamareddy</option>
<option>Karimnagar</option>
<option>Khammam</option>
<option>Kumuram Bheem Asifabad</option>
<option>Mahabubabad</option>
<option>Mahabubnagar</option>
<option>Mancherial</option>
<option>Medak</option>
<option>Medchal–Malkajgiri</option>
<option>Mulugu</option>
<option>Nagarkurnool</option>
<option>Nalgonda</option>
<option>Narayanpet</option>
<option>Nirmal</option>
<option>Nizamabad</option>
<option>Peddapalli</option>
<option>Rajanna Sircilla</option>
<option>Rangareddy</option>
<option>Sangareddy</option>
<option>Siddipet</option>
<option>Suryapet</option>
<option>Vikarabad</option>
<option>Wanaparthy</option>
<option>Warangal</option>
<option>Yadadri Bhuvanagiri</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="REGISTER">
<input type="reset" value="CLEAR">
</td>
</tr>
</table>
</form>

</body>
</html>
